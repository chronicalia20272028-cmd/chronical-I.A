<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-surface: #121216;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-subtle: #71717a;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-primary); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }

        .chat-container { width: 100%; height: 100%; height: 100dvh; background-color: var(--bg-primary); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .chat-top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 40; background: linear-gradient(to bottom, var(--bg-primary) 80%, rgba(9, 9, 11, 0)); }
        .logo-title { font-weight: 600; font-size: 1rem; color: var(--text-main); }
        
        .chat-box { flex: 1; padding: 80px 20px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; max-width: 820px; width: 100%; margin: 0 auto; }
        .message { max-width: 88%; width: 100%; font-size: 0.94rem; line-height: 1.65; word-break: break-word; }
        .message-header { font-size: 0.74rem; font-weight: 600; margin-bottom: 6px; color: var(--text-subtle); text-transform: uppercase; }
        .assistant-message { align-self: flex-start; color: var(--text-main); }
        .user-message { align-self: flex-end; background-color: #1a1a22; padding: 14px 18px; border-radius: 20px 20px 4px 20px; color: var(--text-main); border: 1px solid var(--border-color); }

        .input-container { width: 100%; padding: 12px 20px 20px 20px; background: linear-gradient(to top, var(--bg-primary) 85%, rgba(9, 9, 11, 0)); display: flex; flex-direction: column; align-items: center; }
        .input-wrapper { display: flex; align-items: center; background-color: #141418; border-radius: 32px; padding: 6px 12px; border: 1px solid var(--border-color); width: 100%; max-width: 740px; height: 60px; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .input-wrapper input[type="text"] { flex: 1; background: transparent; border: none; color: #ffffff; font-size: 0.92rem; outline: none; padding: 0 6px; }
        .action-send-btn { background-color: var(--accent-blue); color: #ffffff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        .action-send-btn:hover { background-color: var(--accent-blue-hover); }
    </style>
</head>
<body>

    <div class="chat-container">
        <header class="chat-top-bar">
            <div class="logo-title">Chronical I.A (Direct Gemini)</div>
        </header>

        <div class="chat-box" id="chatBox">
            <div class="message assistant-message">
                <div class="message-header">Chronical I.A</div>
                Olá! Estou ligada diretamente ao motor do Gemini. Escreve uma mensagem!
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Faça uma pergunta à I.A...">
                <button class="action-send-btn" id="sendBtn" type="button" aria-label="Enviar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');

        // Chave inserida diretamente para teste imediato
        const GEMINI_API_KEY = "AQ.Ab8RN6IJ-a0ScVNkl86Cyr8wjJVxU3Nk0a6u3eOquNn6aAL6Gw";

        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-PT';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if(!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'message assistant-message';
            assistantMsg.innerHTML = '<div class="message-header">Chronical I.A</div>A pensar...';
            chatBox.appendChild(assistantMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    assistantMsg.innerHTML = `<div class="message-header">Chronical I.A</div>Erro da API: ${data.error.message}`;
                } else {
                    const resposta = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sem resposta gerada.";
                    assistantMsg.innerHTML = `<div class="message-header">Chronical I.A</div>${resposta}`;
                    falarTexto(resposta);
                }
            } catch (err) {
                assistantMsg.innerHTML = `<div class="message-header">Chronical I.A</div>Erro de rede ao contactar o Gemini.`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
